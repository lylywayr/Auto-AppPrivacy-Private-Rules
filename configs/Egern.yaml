      match: routerlogin.net
      value: system
  - domain:
      match: router.asus.com
      value: system
  - domain:
      match: amplifi.lan
      value: system
  - domain_wildcard:
      match: '*.local'
      value: system
  - domain_wildcard:
      match: '*.lan'
      value: system
  - domain_wildcard:
      match: '*.home'
      value: system
