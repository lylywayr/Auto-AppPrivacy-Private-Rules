    cron: 0 9 * * *
    script_url: https://raw.githubusercontent.com/Yuheng0101/X/main/Tasks/52pojie.js
    update_interval: 0
    timeout: 60
- http_request:
    name: 华住会获取签到Cookie
    match: https:\/\/appgw\.huazhu\.com\/game\/sign_header
    script_url: https://raw.githubusercontent.com/evilbutcher/QuantumultX/main/check_in/hzh/hzh.js
