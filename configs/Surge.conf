[Rule]
# > 0. 配置拉取与 DNS endpoint routing
DOMAIN,dns.alidns.com,DIRECT
DOMAIN,doh.pub,DIRECT
DOMAIN,cloudflare-dns.com,代理策略
DOMAIN,dns.google,代理策略

# > 0.1 Telegram MTProto listener
PROTOCOL,MTProto,电报信息

# > 1. 预匹配拒绝
DEST-PORT,12893,REJECT,pre-matching
AND,((DOMAIN-KEYWORD,61.241.5), (DEST-PORT,12893)),REJECT,pre-matching

# > 2. Tailscale / 回家线路精确路由

# > 2.1 AI 服务独立规则集
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list,ChatGPT,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list,Gemini,no-resolve

# > 2.2 其他明确直连服务
DOMAIN,www.bytecatcode.org,DIRECT

# > 2.3 LCSign 安装服务
DOMAIN-SUFFIX,lcsignx.com,DIRECT
DOMAIN-KEYWORD,lcsignx,DIRECT

# > 3. 基础服务规则集（策略组保持不变）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,电报信息,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,微软服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,谷歌服务,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list,代码托管,no-resolve

# > 3. 局域网 / 系统基础
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,DIRECT,no-resolve
RULE-SET,SYSTEM,DIRECT

# > 4. Cloudflare 专项
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Cloudflarecn/Cloudflarecn.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Cloudflare/Cloudflare.list,橙云加速,no-resolve

# > 5. 国内与其他流量兜底
GEOIP,CN,DIRECT
FINAL,代理策略,dns-failed

